name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Same version as .fvmrc
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: python3 -I tool/test_analytics_report.py
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # H5: same code, served from https://<owner>.github.io/glean/
      - run: flutter build web --release --base-href /glean/ --no-wasm-dry-run

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  # Publishes the H5 build. Off until the repository variable DEPLOY_PAGES
  # is 'true' (and Settings → Pages → Source is GitHub Actions).
  deploy-pages:
    needs: check-and-build
    if: github.event_name == 'push' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
